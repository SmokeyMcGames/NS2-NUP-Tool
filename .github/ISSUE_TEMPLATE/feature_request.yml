name: Feature request
description: Suggest a focused improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and alternatives
      description: Explain the workflow and any tradeoffs.
    validations:
      required: true
