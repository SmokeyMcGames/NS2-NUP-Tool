name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      NUP_REFERENCE_TESTS: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install app and optional reference test fixture
        shell: pwsh
        run: ./Setup.ps1 -Python python -ReferenceTests
      - name: Test, build, and check the portable app
        shell: pwsh
        run: ./Build.ps1
      - name: Save validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-validation
          path: |
            build/gui-smoke.json
            build/portable-smoke.json
          if-no-files-found: warn
          retention-days: 14
